name: ESTLELA Discord safety tests
on:
  pull_request:
    paths: ['discord/**', '.github/workflows/estlela-*.yml']
  push:
    branches: ['fix/production-verification']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m unittest discover -s discord -p 'test_*.py'
      - run: python discord/publish_updates.py --check-only
